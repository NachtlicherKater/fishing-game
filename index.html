<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Fishing Game</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Main Menu -->
    <div class="main-menu show">
        <h1>Непредсказуемая Рыбалка</h1>
        <div class="main-menu-buttons">
            <button class="start-button">Начать игру</button>
            <button class="settings-button">Настройки</button>
            <button class="leaderboards-button">Рекорды</button>
            <button class="exit-button">Выход</button>
        </div>
    </div>
    <!-- Game Window -->
    <div class="game hide">
        <div class="map-viewport">

        </div>
        <div class="person-viewport">

        </div>
        <div class="settings-viewport">
        
        </div>
    </div>
    <!-- Leaderboards -->
    <div class="leaderboards hide">
        <button class="close-leaderboards"></button>
    </div>
    <!-- Settings -->
    <div class="settings hide">

    </div>
    <!-- Scripts -->
    <script src="./scripts/main-menu.js"></script>
</body>
</html>
